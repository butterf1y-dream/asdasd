<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>영어 단어 시험</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: #e2e8f0;
      min-height: 100vh;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.6s;
    }
    .container {
      width: 100%;
      max-width: 580px;
      background: #111827;
      border-radius: 28px;
      border: 1px solid #334155;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }
    header {
      background: linear-gradient(to right, #1e2937, #334155);
      padding: 25px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 1.75rem; }
    .content { padding: 30px 20px; text-align: center; }

    .roulette {
      font-size: 4.8rem;
      font-weight: 900;
      color: #67e8f9;
      margin: 35px 0;
      height: 130px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .roulette.spinning {
      animation: spin 0.07s infinite linear;
    }
    @keyframes spin {
      0% { transform: scale(1); }
      50% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    .start-btn {
      background: #22d3ee;
      color: #0f172a;
      font-size: 1.25rem;
      font-weight: 700;
      padding: 18px 40px;
      border-radius: 9999px;
      cursor: pointer;
      margin: 20px 0;
      width: 85%;
      max-width: 320px;
    }

    .confirm-text {
      font-size: 1.45rem;
      margin: 25px 0;
      font-weight: 600;
    }

    .top-bar {
      display: flex; justify-content: space-between; margin-bottom: 25px;
      font-size: 1.1rem;
    }
    .progress { font-size: 2.4rem; font-weight: 700; }

    #question {
      background: #1e2937;
      padding: 25px 20px;
      border-radius: 20px;
      font-size: 1.3rem;
      margin-bottom: 25px;
      border: 1px solid #475569;
    }

    .options { display: flex; flex-direction: column; gap: 12px; }
    .option {
      background: #334155;
      padding: 18px;
      border-radius: 9999px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .option:hover, .option:active { background: #475569; transform: scale(1.02); }

    .result {
      margin: 20px 0;
      padding: 25px;
      border-radius: 20px;
      font-size: 1.9rem;
      font-weight: 700;
      display: none;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }
    button {
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="container">
  <header><h1>영어 단어 시험</h1></header>
  <div class="content" id="mainContent">
    <div class="start-screen" id="startScreen">
      <h2>두근두근</h2>
      <p style="color:#94a3b8;">(총 127개 단어 중 랜덤)</p>
      
      <div class="roulette" id="roulette">75</div>
      
      <button class="start-btn" id="spinBtn" onclick="startSpinning()">두근두근 돌리기</button>
      
      <div id="confirmArea" style="display:none;">
        <div class="confirm-text">
          <strong><span id="selectedNum">75</span></strong>개 ㅠ푸시네요
        </div>
        <button class="start-btn" onclick="startTest()" style="background:#4ade80;">시작하기</button>
      </div>
    </div>

    <div id="testScreen" style="display: none;">
      <div class="top-bar">
        <div><span class="progress" id="progress">1</span> / <span id="totalNum">0</span></div>
        <div><span class="score" id="score">0</span>점</div>
      </div>
      <div id="question"></div>
      <div class="options" id="options"></div>
      <div id="result" class="result"></div>
      <div class="buttons">
        <button id="nextBtn" onclick="nextQuestion()" style="display:none; background:#22d3ee; color:#0f172a;">다음 문제 →</button>
      </div>
    </div>
  </div>
</div>

<canvas id="confetti" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; display: none;"></canvas>

let selectedWords = [];
let currentQuestion = 0;
let score = 0;
let currentCorrectAnswer = "";
let answered = false;
let totalQuestions = 0;
let isSpinning = false;

// 폭죽 함수
function launchConfetti() {
  const canvas = document.getElementById('confetti');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#f87171', '#fb923c', '#fbbf24', '#a78bfa', '#67e8f9', '#f472b6'];
  let particles = [];

  class Particle {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = Math.random() * canvas.height - canvas.height;
      this.size = Math.random() * 14 + 8;
      this.speed = Math.random() * 8 + 6;
      this.angle = Math.random() * 360;
      this.color = colors[Math.floor(Math.random() * colors.length)];
    }
    update() { this.y += this.speed; this.angle += 7; }
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle * Math.PI / 180);
      ctx.fillStyle = this.color;
      ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
      ctx.restore();
    }
  }

  for (let i = 0; i < 220; i++) particles.push(new Particle());

  let animation = setInterval(() => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
      p.update();
      p.draw();
      if (p.y > canvas.height) particles.splice(i, 1);
    });
    if (particles.length === 0) {
      clearInterval(animation);
      canvas.style.display = 'none';
    }
  }, 20);
}

function startSpinning() {
  if (isSpinning) return;
  isSpinning = true;
  const roulette = document.getElementById('roulette');
  const spinBtn = document.getElementById('spinBtn');
  spinBtn.style.display = 'none';
  roulette.classList.add('spinning');

  let finalNum = 75;
  let count = 0;

  const interval = setInterval(() => {
    finalNum = Math.floor(Math.random() * 51) + 50;
    roulette.textContent = finalNum;
    count++;
    if (count > 42) {
      clearInterval(interval);
      roulette.classList.remove('spinning');
      totalQuestions = finalNum;
      document.getElementById('selectedNum').textContent = totalQuestions;
      document.getElementById('confirmArea').style.display = 'block';
      isSpinning = false;
    }
  }, 50);
}

function startTest() {
  selectedWords = [...wordBank].sort(() => Math.random() - 0.5).slice(0, totalQuestions);
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  document.getElementById('totalNum').textContent = totalQuestions;
  currentQuestion = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  document.getElementById('result').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';

  const q = selectedWords[currentQuestion];
  currentCorrectAnswer = q.eng;

  document.getElementById('question').innerHTML = `
    <strong>${q.kor}</strong><br>
    <small style="color:#94a3b8; font-size:1rem;">위 뜻에 맞는 영어 단어는</small>
  `;

  const optionsDiv = document.getElementById('options');
  optionsDiv.innerHTML = '';

  let wrong = wordBank.filter(w => w.eng !== q.eng)
                     .sort(() => Math.random() - 0.5)
                     .slice(0, 4);

  const options = [...wrong, q].sort(() => Math.random() - 0.5);

  options.forEach(option => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = option.eng;
    div.onclick = () => selectAnswer(option.eng, div);
    optionsDiv.appendChild(div);
  });

  document.getElementById('progress').textContent = currentQuestion + 1;
}

function selectAnswer(selectedEng, element) {
  if (answered) return;
  answered = true;

  const options = document.querySelectorAll('.option');
  const isCorrect = selectedEng === currentCorrectAnswer;

  options.forEach(opt => {
    opt.style.pointerEvents = 'none';
    if (opt.textContent === currentCorrectAnswer) opt.classList.add('correct');
    if (opt.textContent === selectedEng && !isCorrect) opt.classList.add('wrong');
  });

  if (isCorrect) {
    score += 10;
    document.getElementById('score').textContent = score;
  } else {
    document.body.style.background = '#991b1b';
    launchConfetti();
  }

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').innerHTML = isCorrect
    ? " 정답"
    : ` 오답<br><small>정답: <strong>${currentCorrectAnswer}</strong></small>`;

  document.getElementById('nextBtn').style.display = 'block';
}

function nextQuestion() {
  document.body.style.background = 'linear-gradient(135deg, #0f172a 0%, #1e2937 100%)';
  currentQuestion++;
  if (currentQuestion >= totalQuestions) {
    alert(` 시험 끗\n\n최종 점수: ${score}점 / ${totalQuestions * 10}점`);
    resetTest();
  } else {
    loadQuestion();
  }
}

function resetTest() {
  document.body.style.background = 'linear-gradient(135deg, #0f172a 0%, #1e2937 100%)';
  document.getElementById('testScreen').style.display = 'none';
  document.getElementById('startScreen').style.display = 'block';
  document.getElementById('confirmArea').style.display = 'none';
  document.getElementById('spinBtn').style.display = 'block';
  document.getElementById('roulette').textContent = '75';
}
</script>
