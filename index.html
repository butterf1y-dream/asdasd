<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 어순 배열 연습</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
      color: #e2e8f0;
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 620px;           /* 넓이 조절 */
      background: #111827;
      border-radius: 28px;
      border: 1px solid #334155;
      overflow: hidden;
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.5);
    }

    header {
      background: linear-gradient(to right, #1e2937, #334155);
      padding: 32px 40px;
      text-align: center;
    }

    header h1 {
      font-size: 1.65rem;
      font-weight: 600;
      margin: 0;
    }

    .content { padding: 40px; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .progress {
      font-size: 2.8rem;
      font-weight: 700;
      color: #f8fafc;
    }

    .score-box { text-align: right; }
    .score-label { font-size: 0.8rem; color: #94a3b8; }
    .score { font-size: 1.9rem; font-weight: 600; color: #34d399; }

    #korean {
      background: #1e2937;
      border-radius: 20px;
      padding: 32px;
      font-size: 1.15rem;
      line-height: 1.65;
      margin-bottom: 36px;
      border: 1px solid #475569;
    }

    .section-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #94a3b8;
      margin-bottom: 10px;
      padding-left: 8px;
    }

    #answerArea, #wordBank {
      background: #0f172a;
      border: 2px dashed #64748b;
      border-radius: 20px;
      padding: 24px;
      min-height: 130px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
    }

    .word {
      background: #334155;
      color: #f1f5f9;
      padding: 13px 24px;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .word:hover { background: #475569; transform: translateY(-2px); }
    #answerArea .word { background: #475569; }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 32px;
    }

    button {
      padding: 18px;
      font-size: 1.1rem;
      font-weight: 500;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset {
      background: #334155;
      color: white;
      border: 1px solid #475569;
    }

    .btn-check {
      background: #22d3ee;
      color: #0f172a;
      font-weight: 600;
    }
  </style>
</head>
<body>

<div class="container">
  <header><h1>영어 어순 배열 연습</h1></header>

  <div class="content">
    <div class="top-bar">
      <div>
        <span class="progress" id="progress">1</span>
        <small style="color:#64748b;"> / 10</small>
      </div>
      <div class="score-box">
        <div class="score-label">점수</div>
        <div class="score" id="score">0</div>
      </div>
    </div>

    <div id="korean"></div>

    <div class="section-label">답안 영역</div>
    <div id="answerArea"></div>

    <div class="section-label">단어 선택</div>
    <div id="wordBank"></div>

    <div class="buttons">
      <button class="btn-reset" onclick="resetAnswer()">초기화</button>
      <button class="btn-check" onclick="checkAnswer()">확인하기</button>
    </div>
  </div>
</div>

<script>
// ================== 문제 데이터 ==================
let currentQuestion = 0;
let score = 0;

const questions = [
  {

  //예시
    korean: "사회학자들은 이러한 과정을 '인종화'라고 부르기를 선호한다.",
    words: ["Sociologists", "prefer", "to", "call", "these", "processes", "'racialization'."],
    correct: ["Sociologists", "prefer", "to", "call", "these", "processes", "'racialization'."]
  }
  // 문제 추가 해야함
];

let selected = [];
let originalWords = [];

// ================== 유틸 함수 ==================
function shuffle(array) {
  return array.sort(() => Math.random() - 0.5);
}

// ================== 메인 함수 ==================
function loadQuestion() {
  const q = questions[currentQuestion];
  originalWords = [...q.words];
  
  document.getElementById('progress').textContent = currentQuestion + 1;
  document.getElementById('score').textContent = score;
  document.getElementById('korean').textContent = q.korean;

  selected = [];
  renderWordBank();
  updateAnswerArea();
}

function renderWordBank() {
  const bank = document.getElementById('wordBank');
  bank.innerHTML = '';

  const shuffled = shuffle([...originalWords]);
  
  shuffled.forEach(word => {
    if (selected.includes(word)) return; // 이미 선택한 단어는 제외

    const div = document.createElement('div');
    div.className = 'word';
    div.textContent = word;
    div.onclick = () => selectWord(word, div);
    bank.appendChild(div);
  });
}

function selectWord(word, element) {
  selected.push(word);
  updateAnswerArea();
  renderWordBank();        // bank 새로고침
}

function updateAnswerArea() {
  const area = document.getElementById('answerArea');
  area.innerHTML = '';

  selected.forEach((word, i) => {
    const div = document.createElement('div');
    div.className = 'word';
    div.textContent = word;
    div.onclick = () => removeWord(i);     // 해당 단어만 제거
    area.appendChild(div);
  });
}

function removeWord(index) {
  selected.splice(index, 1);
  updateAnswerArea();
  renderWordBank();
}

function checkAnswer() {
  const q = questions[currentQuestion];
  const userAnswer = selected.join(" ");
  const correctAnswer = q.correct.join(" ");

  if (userAnswer === correctAnswer) {
    score += 10;
    document.getElementById('score').textContent = score;
    alert("정답입니다.");
    if (currentQuestion < questions.length - 1) {
      setTimeout(() => { currentQuestion++; loadQuestion(); }, 700);
    }
  } else {
    alert(`오답입니다.\n\n정답: ${correctAnswer}`);
    
    // 오답 시 단어 위치 랜덤 섞기 (힌트)
    renderWordBank();
    
    if (confirm("다시 풀어보시겠습니까?")) {
      // 그대로 유지
    } else if (currentQuestion < questions.length - 1) {
      currentQuestion++;
      loadQuestion();
    }
  }
}

function resetAnswer() {
  loadQuestion();
}

// 시작
loadQuestion();
</script>
</body>
</html>
